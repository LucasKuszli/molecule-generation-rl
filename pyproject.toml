[project]
name = "molecules-and-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.0.1+cu118",
    "torchvision==0.15.2+cu118",
    "torchaudio==2.0.2+cu118",
    "chemprop",
    "markupsafe<3",
    "datasets>=2.19.1",
    "numpy<2",
    "tqdm>=4.66.5",
    "pillow>=12.0.0",
    "ruff>=0.15.2",
    "torch-geometric>=2.7.0",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.3",
    "optuna>=3.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu118"

[tool.setuptools.packages.find]
where = ["src"]
